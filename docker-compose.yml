# Open-source LiveKit (no LiveKit Cloud).
# Usage: docker compose up -d
#
# EC2: uses host Redis on 127.0.0.1:6379 (already running) and host networking
# so we do not fight the existing Redis bind on 6379. LiveKit + SIP share it.
#
# Dev credentials (from --dev mode):
#   LIVEKIT_API_KEY=devkey
#   LIVEKIT_API_SECRET=secret
#   LIVEKIT_URL=ws://localhost:7880

services:
  livekit:
    image: livekit/livekit-server:latest
    network_mode: host
    # EC2 telephony: advertise public IP for WebRTC ICE.
    # Local browser: docker-compose.override.yml (gitignored) overrides to 127.0.0.1.
    command: --dev --bind 0.0.0.0 --redis-host 127.0.0.1:6379 --node-ip 54.198.15.14
    restart: unless-stopped

  # Open-source LiveKit SIP (Twilio PSTN bridge). Needs public IP + SG:
  # UDP/TCP 5060 and UDP 10000-20000.
  livekit-sip:
    image: livekit/sip:latest
    network_mode: host
    environment:
      SIP_CONFIG_BODY: |
        api_key: devkey
        api_secret: secret
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6379
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        logging:
          level: debug
    depends_on:
      - livekit
    restart: unless-stopped
