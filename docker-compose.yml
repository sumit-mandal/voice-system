# Open-source LiveKit (no LiveKit Cloud).
# Usage: docker compose up -d
#
# Dev credentials (from --dev mode):
#   LIVEKIT_API_KEY=devkey
#   LIVEKIT_API_SECRET=secret
#   LIVEKIT_URL=ws://localhost:7880

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    # EC2 telephony: advertise public IP for WebRTC ICE.
    # Local browser: docker-compose.override.yml (gitignored) overrides to 127.0.0.1.
    # Pushing this file does not require EC2 env or rebuild changes.
    command: --dev --bind 0.0.0.0 --redis-host redis:6379 --node-ip 54.198.15.14
    ports:
      - "7880:7880" # WebSocket / HTTP
      - "7881:7881" # RTC TCP
      - "7882:7882/udp" # TURN/UDP (dev)
    depends_on:
      - redis
    restart: unless-stopped

  # Open-source LiveKit SIP (Twilio PSTN bridge). Needs public IP + SG:
  # UDP/TCP 5060 and UDP 10000-20000.
  livekit-sip:
    image: livekit/sip:latest
    network_mode: host
    environment:
      SIP_CONFIG_BODY: |
        api_key: devkey
        api_secret: secret
        ws_url: ws://127.0.0.1:7880
        redis:
          address: 127.0.0.1:6379
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        logging:
          level: debug
    depends_on:
      - livekit
      - redis
    restart: unless-stopped
